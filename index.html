<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento Preventivo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Cargar Archivos necesarios para el cruce -->
    <div style="margin-top: 15px;">
      <label for="archivoMPautin">
          <strong>Cargar archivo MP Autin:</strong>
      </label>

      <input
          type="file"
          id="archivoMPautin"
          accept=".xlsx"
      >
    </div>

<div id="estadoArchivo" style="margin-top: 8px;"></div> 
    <div class="container" id="VerificacionPlanMensual" >
        <h1>Verificacion Plan Mensual</h1>
        
        <div style="margin-bottom: 20px; padding: 15px; background: #f0f8ff; border-radius: 5px;">
            <label for="filtroMes" style="font-weight: bold; margin-right: 10px;">Filtrar por mes:</label>
            <select id="filtroMes" style="padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
                <option value="">-- Todos los meses --</option>
                <option value="1">Enero</option>
                <option value="2">Febrero</option>
                <option value="3">Marzo</option>
                <option value="4">Abril</option>
                <option value="5">Mayo</option>
                <option value="6">Junio</option>
                <option value="7">Julio</option>
                <option value="8">Agosto</option>
                <option value="9">Septiembre</option>
                <option value="10">Octubre</option>
                <option value="11">Noviembre</option>
                <option value="12">Diciembre</option>
            </select>
            <button onclick="aplicarFiltro()" style="padding: 8px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px; font-weight: bold;">🔍 Filtrar</button>
            <button onclick="limpiarFiltro()" style="padding: 8px 20px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px;">✕ Limpiar</button>
        </div>

        <div id="loading" class="loading">Cargando datos...</div>
        <div id="error"></div>
        <div id="contadorFilas"></div>
        <table id="tabla" style="display: none;">
            <thead>
                <tr id="encabezados"></tr>
            </thead>
            <tbody id="datos"></tbody>
        </table>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="app.js" defer></script>
</body>
</html>
